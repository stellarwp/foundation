name: Tests
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: true
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
    # Preserve existing required-check names when changing runner providers.
    name: Tests PHP${{ matrix.php }} - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Run Unit Tests
        run: vendor/bin/phpunit --configuration ./phpunit.xml.dist --colors=always --testsuite Unit

      - name: Run Feature Tests
        run: vendor/bin/phpunit --configuration ./phpunit.xml.dist --colors=always --testsuite Feature

  monolog:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Monolog ${{ matrix.monolog }} compatibility
    strategy:
      fail-fast: false
      matrix:
        monolog: [ '2.11.0', '3.10.0' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Install supported Monolog floor
        run: composer update monolog/monolog:${{ matrix.monolog }} --with-all-dependencies --no-interaction --prefer-dist

      - name: Analyze supported Monolog APIs
        run: composer analyze

      - name: Test logging behavior
        run: |
          vendor/bin/phpunit --configuration phpunit.xml.dist tests/Unit/Log
          vendor/bin/phpunit --configuration phpunit.xml.dist tests/Feature/Log

  slic:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: SLIC Tests

    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout SLIC
        uses: actions/checkout@v6
        with:
          repository: stellarwp/slic
          ref: main
          path: slic
          fetch-depth: 1

      - name: Set up host PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache-directory
        run: |
          cache_directory=$(composer config cache-dir --absolute)
          echo "path=$cache_directory" >> "$GITHUB_OUTPUT"

      - name: Restore Composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache-directory.outputs.path }}
          key: ${{ runner.os }}-composer-slic-php8.3-v1-${{ hashFiles('composer.lock', 'composer.json', 'src/*/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-slic-php8.3-v1-

      - name: Set SLIC environment variables
        run: |
          echo "SLIC_BIN=${GITHUB_WORKSPACE}/slic/slic" >> $GITHUB_ENV
          echo "SLIC_WP_DIR=${GITHUB_WORKSPACE}/slic/_wordpress" >> $GITHUB_ENV
          echo "SLIC_WORDPRESS_DOCKERFILE=Dockerfile.base" >> $GITHUB_ENV
          echo "SLIC=1" >> $GITHUB_ENV
          echo "CI=1" >> $GITHUB_ENV

      - name: Start ssh-agent
        run: |
          mkdir -p "${HOME}/.ssh"
          ssh-agent -a /tmp/ssh_agent.sock
          echo "SSH_AUTH_SOCK=/tmp/ssh_agent.sock" >> $GITHUB_ENV

      - name: Configure SLIC
        env:
          COMPOSER_CACHE_PATH: ${{ steps.composer-cache-directory.outputs.path }}
        run: |
          cd "${GITHUB_WORKSPACE}/.."
          "${SLIC_BIN}" here
          "${SLIC_BIN}" interactive off
          "${SLIC_BIN}" build-prompt off
          "${SLIC_BIN}" build-subdir off
          "${SLIC_BIN}" xdebug off
          "${SLIC_BIN}" debug on
          "${SLIC_BIN}" php-version set 8.3 --skip-rebuild
          "${SLIC_BIN}" composer-cache set "$COMPOSER_CACHE_PATH"
          "${SLIC_BIN}" info
          "${SLIC_BIN}" config

      - name: Install dependencies
        run: |
          "${SLIC_BIN}" use foundation
          "${SLIC_BIN}" composer install

      - name: Update WordPress
        run: |
          "${SLIC_BIN}" wp core update --force

      - name: Build Codeception actors
        run: |
          "${SLIC_BIN}" cc build

      - name: Run unit tests
        if: github.event_name != 'pull_request'
        run: |
          "${SLIC_BIN}" run unit --ext DotReporter

      - name: Run feature tests
        if: github.event_name != 'pull_request'
        run: |
          "${SLIC_BIN}" run feature --ext DotReporter

      - name: Run wpunit tests
        if: github.event_name != 'pull_request'
        run: |
          "${SLIC_BIN}" run wpunit --ext DotReporter

      - name: Enable PCOV for coverage
        if: github.event_name == 'pull_request'
        run: |
          "${SLIC_BIN}" pcov on

      - name: Run Codeception tests with coverage
        if: github.event_name == 'pull_request'
        run: |
          "${SLIC_BIN}" run --coverage --coverage-xml clover.xml --disable-coverage-php --ext DotReporter

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: tests/_output/clover.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    if: github.event_name == 'pull_request'
    needs: slic
    runs-on: blacksmith-2vcpu-ubuntu-2404
    name: Monitor coverage

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: Monitor coverage
        uses: slavcodev/coverage-monitor-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_footer: false
          coverage_format: clover
          coverage_path: clover.xml
          threshold_alert: 90
          threshold_warning: 95
          threshold_metric: "lines"
