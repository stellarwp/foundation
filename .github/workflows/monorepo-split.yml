# Pushes package code and release tags out to stellarwp/foundation-* split repositories.
name: Split Monorepo Packages and Release

on:
  push:
    branches:
      - main
    # Release tags only (X.Y.Z), the versions the bump job and the split repositories expect.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# The action updates the same split branches for main and tags; serialize publication.
concurrency:
  group: foundation-package-publication
  cancel-in-progress: false

# GH_BOT_TOKEN is scoped to the steps that need it. Never expose it through workflow- or job-level env,
# which hands it to every step, including third-party actions and Composer scripts.

jobs:
  list-repos:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Dynamically build an array of JSON objects that each contain "name" and "directory" properties.
      - name: Set repo matrix
        id: set-matrix
        run: echo "matrix=$(./.github/bin/repo-map.sh)" >> "$GITHUB_OUTPUT"

  split:
    needs: list-repos
    runs-on: blacksmith-2vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-repos.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The third-party split action reads the mounted workspace; leave no credentials in it.
          persist-credentials: false

      - name: Check split credentials
        env:
          PAT: ${{ secrets.GH_BOT_TOKEN }}
        run: test -n "$PAT"

      # no tag
      - name: Split with no tag
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        # 5.0.0 authenticates with a header instead of a token-bearing clone URL and escapes its inputs.
        uses: moderntribe/monorepo-split-github-action@dd974a563d54c516fa49c0143632d92ccbe78a3c # 5.0.0
        env:
          PAT: ${{ secrets.GH_BOT_TOKEN }}
        with:
          package_directory: 'src/${{ matrix.package.directory }}'
          repository_organization: 'stellarwp'
          repository_name: '${{ matrix.package.name }}'

          # ↓ the user signed under the split commit
          user_name: "StellarWP GitHub Action"
          user_email: "action@github.com"

      # with tag
      - name: With regular tag
        if: ${{ startsWith(github.ref, 'refs/tags/')}}
        # 5.0.0 authenticates with a header instead of a token-bearing clone URL and escapes its inputs.
        uses: moderntribe/monorepo-split-github-action@dd974a563d54c516fa49c0143632d92ccbe78a3c # 5.0.0
        env:
          PAT: ${{ secrets.GH_BOT_TOKEN }}
        with:
          tag: ${{ github.ref_name }}

          package_directory: 'src/${{ matrix.package.directory }}'
          repository_organization: 'stellarwp'
          repository_name: '${{ matrix.package.name }}'

          # ↓ the user signed under the split commit
          user_name: "StellarWP GitHub Action"
          user_email: "action@github.com"

      # Defense in depth: confirm the split repository now matches the source tree.
      - name: Verify published package tree
        env:
          # The split repositories are public, so the read-only workflow token is enough.
          GH_TOKEN: ${{ github.token }}
          PACKAGE_REPOSITORY: ${{ matrix.package.name }}
          PACKAGE_DIRECTORY: ${{ matrix.package.directory }}
        shell: bash
        run: |
          set -euo pipefail
          published_ref=main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            published_ref="$GITHUB_REF_NAME"
          fi
          expected_tree=$(git rev-parse "${GITHUB_SHA}:src/${PACKAGE_DIRECTORY}")
          actual_tree=$(gh api "repos/stellarwp/${PACKAGE_REPOSITORY}/commits/${published_ref}" --jq '.commit.tree.sha')
          if [[ "$actual_tree" != "$expected_tree" ]]; then
            echo "Published ${PACKAGE_REPOSITORY}@${published_ref} does not match the release source."
            exit 1
          fi
          echo "Verified ${PACKAGE_REPOSITORY}@${published_ref}."

  # Prepares the next development line without any secrets. Composer runs third-party code here, which could
  # leave git filters, hooks, fsmonitor or http settings behind in the checkout, so this job only produces a patch.
  bump-next-development-line:
    needs: split
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      alias: ${{ steps.version.outputs.alias }}
      has_changes: ${{ steps.patch.outputs.has_changes }}

    steps:
      - name: Determine next development line
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.0$ ]]; then
            echo "Tag ${tag} is not a minor or major release tag ending in .0; skipping dev-main bump."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          next_minor=$((minor + 1))

          echo "should_bump=true" >> "$GITHUB_OUTPUT"
          echo "constraint=^${major}.${next_minor}" >> "$GITHUB_OUTPUT"
          echo "alias=${major}.${next_minor}.x-dev" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false

      - name: Set up PHP
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          # The patch from this job is pushed to main; don't restore a cache other workflows could have written.
          ignore-cache: true

      - name: Bump next development line
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        env:
          NEXT_CONSTRAINT: ${{ steps.version.outputs.constraint }}
        run: |
          composer monorepo bump-interdependency "$NEXT_CONSTRAINT"
          composer monorepo package-alias
          composer monorepo merge

      - name: Create next development line patch
        id: patch
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        run: |
          if git diff --quiet -- composer.json 'src/*/composer.json'; then
            echo "No next development line changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff -- composer.json 'src/*/composer.json' > "$RUNNER_TEMP/next-development-line.patch"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload next development line patch
        if: ${{ steps.patch.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-development-line
          path: ${{ runner.temp }}/next-development-line.patch
          if-no-files-found: error
          retention-days: 1

  # Commits and pushes the prepared bump. This is the only job with the bot token, and it never runs Composer
  # or applies anything beyond the expected version constraint and branch alias changes.
  push-next-development-line:
    needs: bump-next-development-line
    if: ${{ needs.bump-next-development-line.outputs.has_changes == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          # Keep this false: the push below sends its own Authorization header, and a persisted
          # checkout header would be sent alongside it.
          persist-credentials: false

      - name: Download next development line patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-development-line
          path: ${{ runner.temp }}/next-development-line

      - name: Verify and commit next development line
        env:
          NEXT_ALIAS: ${{ needs.bump-next-development-line.outputs.alias }}
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/next-development-line/next-development-line.patch"

          # Only package manifests may change. A patch git can't parse fails here.
          changed_files=$(git apply --numstat "$patch" | cut -f3)
          unexpected_files=$(grep -vE '^(composer\.json|src/[A-Za-z0-9_-]+/composer\.json)$' <<< "$changed_files" || true)
          if [[ -n "$unexpected_files" ]]; then
            echo "Patch changes unexpected files:"
            echo "$unexpected_files"
            exit 1
          fi

          git apply --index "$patch"

          # Compare the staged manifests with HEAD as JSON rather than parsing diff lines: only Foundation
          # constraints set to the expected "^X.Y" and dev-main aliases set to NEXT_ALIAS may change.
          mapfile -t files <<< "$changed_files"
          python3 -I .github/bin/verify-development-line-bump.py "$NEXT_ALIAS" "${files[@]}"

          git config user.name "StellarWP GitHub Action"
          git config user.email "action@github.com"
          git commit -m "Bump Foundation to ${NEXT_ALIAS}"

      - name: Push next development line
        env:
          GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          # Authenticate with a header passed through env so the token never appears in a URL, argv, or .git/config.
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_BOT_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="$auth_header" \
            git push origin HEAD:main
