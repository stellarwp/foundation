# Pushes package code and release tags out to stellarwp/foundation-* split repositories.
name: Split Monorepo Packages and Release

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read

# The action updates the same split branches for main and tags; serialize publication.
concurrency:
  group: foundation-package-publication
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GH_BOT_TOKEN }}

jobs:
  list-repos:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Dynamically build an array of JSON objects that each contain "name" and "directory" properties.
      - name: Set repo matrix
        id: set-matrix
        run: |
          matrix=$(./.github/bin/repo-map.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  split:
    needs: list-repos
    runs-on: blacksmith-2vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-repos.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check split credentials
        run: test -n "$GITHUB_TOKEN"

      # no tag
      - name: Split with no tag
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        uses: moderntribe/monorepo-split-github-action@4.0.2
        with:
          package_directory: 'src/${{ matrix.package.directory }}'
          repository_organization: 'stellarwp'
          repository_name: '${{ matrix.package.name }}'

          # ↓ the user signed under the split commit
          user_name: "StellarWP GitHub Action"
          user_email: "action@github.com"

      # with tag
      - name: With regular tag
        if: ${{ startsWith(github.ref, 'refs/tags/')}}
        uses: moderntribe/monorepo-split-github-action@4.0.2
        with:
          tag: ${{ github.ref_name }}

          package_directory: 'src/${{ matrix.package.directory }}'
          repository_organization: 'stellarwp'
          repository_name: '${{ matrix.package.name }}'

          # ↓ the user signed under the split commit
          user_name: "StellarWP GitHub Action"
          user_email: "action@github.com"

      # The upstream split action does not consistently fail on unsuccessful git pushes.
      - name: Verify published package tree
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
          PACKAGE_REPOSITORY: ${{ matrix.package.name }}
          PACKAGE_DIRECTORY: ${{ matrix.package.directory }}
        shell: bash
        run: |
          set -euo pipefail
          published_ref=main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            published_ref="$GITHUB_REF_NAME"
          fi
          expected_tree=$(git rev-parse "${GITHUB_SHA}:src/${PACKAGE_DIRECTORY}")
          actual_tree=$(gh api "repos/stellarwp/${PACKAGE_REPOSITORY}/commits/${published_ref}" --jq '.commit.tree.sha')
          if [[ "$actual_tree" != "$expected_tree" ]]; then
            echo "Published ${PACKAGE_REPOSITORY}@${published_ref} does not match the release source."
            exit 1
          fi
          echo "Verified ${PACKAGE_REPOSITORY}@${published_ref}."

  bump-next-development-line:
    needs: split
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Determine next development line
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^([0-9]+)\.([0-9]+)\.0$ ]]; then
            echo "Tag ${tag} is not a minor or major release tag ending in .0; skipping dev-main bump."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          next_minor=$((minor + 1))

          echo "should_bump=true" >> "$GITHUB_OUTPUT"
          echo "constraint=^${major}.${next_minor}" >> "$GITHUB_OUTPUT"
          echo "alias=${major}.${next_minor}.x-dev" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GH_BOT_TOKEN }}
          fetch-depth: 0

      - name: Set up PHP
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Bump next development line
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        run: |
          composer monorepo bump-interdependency "${{ steps.version.outputs.constraint }}"
          composer monorepo package-alias
          composer monorepo merge

      - name: Commit next development line
        if: ${{ steps.version.outputs.should_bump == 'true' }}
        run: |
          if git diff --quiet -- composer.json src/*/composer.json; then
            echo "No next development line changes to commit."
            exit 0
          fi

          git config user.name "StellarWP GitHub Action"
          git config user.email "action@github.com"
          git add composer.json src/*/composer.json
          git commit -m "Bump Foundation to ${{ steps.version.outputs.alias }}"
          git push origin HEAD:main
