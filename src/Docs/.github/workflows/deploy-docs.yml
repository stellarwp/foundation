name: Deploy Documentation

on:
  push:
    tags:
      - '*'

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout tagged documentation
        uses: actions/checkout@v7

      - name: Verify published Foundation release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$(gh api "repos/stellarwp/foundation/releases/tags/${GITHUB_REF_NAME}" --jq '.draft == false and .prerelease == false')" != "true" ]]; then
            echo "${GITHUB_REF_NAME} is not a published stable Foundation release."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build

      - name: Deploy production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_DEPLOY_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          command: pages deploy dist --project-name=foundation-docs --branch=production
